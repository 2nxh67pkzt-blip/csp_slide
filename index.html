<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Csp slide</title>

    <link rel="stylesheet" href="./css/style.css" />

    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css"
    />

    <link rel="stylesheet" href="./fonts/stylesheet.css">

    <script
      defer
      src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"
    ></script>
    <script defer src="./js/index.js"></script>
  </head>

  <body>
    <main>
      <section>
        <div class="container">
          <h2 class="container__title">Ремонт техники различных брендов</h2>
          <ul class="list list--desktop">
            <li class="list__item">
              <img src="./img/lenovo.svg" /><button class="list-item__btn">
                <img src="./img/go.svg" />
              </button>
            </li>
            <li class="list__item">
              <img src="./img/samsung.svg" /><button class="list-item__btn">
                <img src="./img/go.svg" />
              </button>
            </li>
            <li class="list__item">
              <img src="./img/apple.svg" /><button class="list-item__btn">
                <img src="./img/go.svg" />
              </button>
            </li>
            <li class="list__item">
              <img src="./img/viewSonic.svg" /><button class="list-item__btn">
                <img src="./img/go.svg" />
              </button>
            </li>
            <li class="list__item">
              <img src="./img/bosch.svg" /><button class="list-item__btn">
                <img src="./img/go.svg" />
              </button>
            </li>
            <li class="list__item">
              <img src="./img/hp.svg" width="52" height="52" /><button class="list-item__btn">
                <img src="./img/go.svg" />
              </button>
            </li>
            <li class="list__item">
              <img src="./img/acer.svg" /><button class="list-item__btn">
                <img src="./img/go.svg" />
              </button>
            </li>
            <li class="list__item">
              <img src="./img/sony.svg" /><button class="list-item__btn">
                <img src="./img/go.svg" />
              </button>
            </li>
            <li class="list__item list__item--hidden">
              <img src="./img/lenovo.svg" /><button class="list-item__btn">
                <img src="./img/go.svg" />
              </button>
            </li>
            <li class="list__item list__item--hidden">
              <img src="./img/samsung.svg" /><button class="list-item__btn">
                <img src="./img/go.svg" />
              </button>
            </li>
            <li class="list__item list__item--hidden">
              <img src="./img/apple.svg" /><button class="list-item__btn">
                <img src="./img/go.svg" />
              </button>
            </li>
          </ul>

          <div class="swiper list list--mobile">
            <div class="swiper-wrapper">
              <div class="swiper-slide list__item">
                <img src="./img/lenovo.svg" /><button class="list-item__btn">
                  <img src="./img/go.svg" />
                </button>
              </div>
              <div class="swiper-slide list__item">
                <img src="./img/samsung.svg" /><button class="list-item__btn">
                  <img src="./img/go.svg" />
                </button>
              </div>
              <div class="swiper-slide list__item">
                <img src="./img/apple.svg" /><button class="list-item__btn">
                  <img src="./img/go.svg" />
                </button>
              </div>
              <div class="swiper-slide list__item">
                <img src="./img/viewSonic.svg" /><button class="list-item__btn">
                  <img src="./img/go.svg" />
                </button>
              </div>
              <div class="swiper-slide list__item">
                <img src="./img/bosch.svg" /><button class="list-item__btn">
                  <img src="./img/go.svg" />
                </button>
              </div>
              <div class="swiper-slide list__item">
                <img src="./img/hp.svg" /><button class="list-item__btn">
                  <img src="./img/go.svg" />
                </button>
              </div>
              <div class="swiper-slide list__item">
                <img src="./img/acer.svg" /><button class="list-item__btn">
                  <img src="./img/go.svg" />
                </button>
              </div>
              <div class="swiper-slide list__item">
                <img src="./img/sony.svg" /><button class="list-item__btn">
                  <img src="./img/go.svg" />
                </button>
              </div>
              <div class="swiper-slide list__item">
                <img src="./img/lenovo.svg" /><button class="list-item__btn">
                  <img src="./img/go.svg" />
                </button>
              </div>
              <div class="swiper-slide list__item">
                <img src="./img/samsung.svg" /><button class="list-item__btn">
                  <img src="./img/go.svg" />
                </button>
              </div>
              <div class="swiper-slide list__item">
                <img src="./img/apple.svg" /><button class="list-item__btn">
                  <img src="./img/go.svg" />
                </button>
              </div>
            </div>
          </div>
          <div class="swiper-pagination"></div>

          <button class="button button--desktop">
            <img class="arrow" src="./img/icon.svg" width="7" height="10" />
            <div>
              <span class="button__text">Показать все</span>
              <span class="button__text button__text--hidden">Скрыть</span>
            </div>
          </button>
        </div>
      </section>
    </main>
  </body>
</html>
